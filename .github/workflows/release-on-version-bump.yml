name: Release on version bump

# Watches the VERSION file on main. When a push changes it, publishes a
# GitHub Release — gh creates the tag at the pushed commit as part of
# that. Pure shell + gh CLI, no LLM call and no ANTHROPIC_API_KEY. Needs
# `contents: write` for the automatic GITHUB_TOKEN, which also has to be
# allowed repo-side: Settings → Actions → General → Workflow permissions
# → "Read and write permissions", or this fails with a bare 403.
on:
  push:
    branches: [main]
    paths:
      - VERSION
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="$(tr -d '[:space:]' < VERSION)"
          tag="v${version}"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists — nothing to do."
            exit 0
          fi

          previous_tag="$(git tag --merged HEAD --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"

          if [ -n "${previous_tag}" ]; then
            range="${previous_tag}..HEAD"
          else
            range="HEAD"
          fi

          notes_file="$(mktemp)"
          fixes_file="$(mktemp)"
          feats_file="$(mktemp)"
          other_file="$(mktemp)"

          while IFS= read -r line; do
            [ -z "${line}" ] && continue
            subject="${line#* }"
            prefix="${subject%%:*}"
            rest="${subject#*: }"
            case "${prefix}" in
              fix|fix\(*)   echo "- ${rest}" >> "${fixes_file}" ;;
              feat|feat\(*) echo "- ${rest}" >> "${feats_file}" ;;
              *)            echo "- ${subject}" >> "${other_file}" ;;
            esac
          done < <(git log "${range}" --oneline --no-merges -- . ':!VERSION' 2>/dev/null || true)

          {
            if [ -s "${feats_file}" ]; then
              echo "## Новое"
              cat "${feats_file}"
              echo
            fi
            if [ -s "${fixes_file}" ]; then
              echo "## Исправления"
              cat "${fixes_file}"
              echo
            fi
            if [ -s "${other_file}" ]; then
              echo "## Прочее"
              cat "${other_file}"
              echo
            fi
          } > "${notes_file}"

          if [ ! -s "${notes_file}" ]; then
            echo "Release ${tag}." > "${notes_file}"
          fi

          # gh creates the tag itself, at --target, through the API — one
          # call instead of tag + push + create, and one thing that can
          # fail instead of two. (Both still need contents: write.)
          gh release create "${tag}" \
            --target "${GITHUB_SHA}" \
            --title "${tag}" \
            --notes-file "${notes_file}"
